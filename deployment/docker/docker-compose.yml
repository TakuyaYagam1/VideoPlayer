services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ifbest_video_player
      POSTGRES_USER: ifbest
      POSTGRES_PASSWORD: ifbest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifbest -d ifbest_video_player"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  migrate:
    image: ifbest-video-player-backend:local
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://ifbest:ifbest@postgres:5432/ifbest_video_player?sslmode=disable
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ifbest-video-player-backend:local
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://ifbest:ifbest@postgres:5432/ifbest_video_player?sslmode=disable
      SHUTDOWN_TIMEOUT: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${BACKEND_PORT:-18080}:8080"

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../frontend:/srv/frontend:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
